apiVersion: apps/v1
kind: Deployment

metadata:
  name: vulnerable-flask-app
  namespace: devsecops

spec:

  replicas: 2

  selector:
    matchLabels:
      app: vulnerable-flask-app

  template:

    metadata:
      labels:
        app: vulnerable-flask-app

    spec:

      containers:

        - name: flask-app

          image: 266092630927.dkr.ecr.ap-south-1.amazonaws.com/vulnerable-flask-app:1.0

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          envFrom:
            - secretRef:
                name: postgres-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
