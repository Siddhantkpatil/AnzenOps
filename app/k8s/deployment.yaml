apiVersion: apps/v1
kind: Deployment

metadata:
  name: vulnerable-flask-app
  namespace: devsecops

spec:

  replicas: 2

  selector:
    matchLabels:
      app: vulnerable-flask-app

  template:

    metadata:
      labels:
        app: vulnerable-flask-app

    spec:

      containers:

        - name: flask-app

          # GitHub Actions will replace IMAGE_PLACEHOLDER
          # with the exact ECR image and Git commit SHA.
          image: 266092630927.dkr.ecr.ap-south-1.amazonaws.com/vulnerable-flask-app:af53ad503d156db3b452e7094d9becba89223c29

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          envFrom:
            - secretRef:
                name: postgres-secret

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "513Mi"
