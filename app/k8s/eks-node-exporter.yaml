apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter

spec:

  selector:
    matchLabels:
      app: node-exporter

  template:

    metadata:
      labels:
        app: node-exporter

    spec:

      hostNetwork: true

      hostPID: true

      containers:

        - name: node-exporter

          image: prom/node-exporter:v1.8.2

          args:

            - "--path.rootfs=/host"

          ports:

            - name: metrics

              containerPort: 9100

              hostPort: 9100

          resources:

            requests:
              cpu: 50m
              memory: 50Mi

            limits:
              cpu: 200m
              memory: 100Mi

          volumeMounts:

            - name: rootfs

              mountPath: /host

              readOnly: true

      volumes:

        - name: rootfs

          hostPath:

            path: /

