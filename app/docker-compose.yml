version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: clipboard-postgres

    environment:

      POSTGRES_DB: clipboarddb

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    volumes:

      - postgres_data:/var/lib/postgresql/data

    networks:

      - backend


  flask-app:

    build: .

    container_name: vulnerable-flask-app

    ports:

      - "5000:5000"

    environment:

      DB_HOST: postgres

      DB_NAME: clipboarddb

      DB_USER: postgres

      DB_PASSWORD: postgres

      DB_PORT: 5432

    depends_on:

      - postgres

    networks:

      - backend


networks:

  backend:


volumes:

  postgres_data:
