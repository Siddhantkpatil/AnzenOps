name: DevSecOps CI Pipeline

on:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: write


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  AWS_REGION: ${{ secrets.AWS_REGION }}

  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}


jobs:

  # ==========================================================
  # JOB 1: CODE QUALITY AND SECURITY
  # ==========================================================

  security-quality:

    name: Code Quality & Security

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT CODE
      # --------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # 2. SETUP PYTHON
      # --------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Dependencies

        working-directory: app

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # --------------------------------------------------------
      # 4. RUN PYTHON TESTS
      # --------------------------------------------------------

      - name: Run Tests

        working-directory: app

        run: |

          python -m compileall .

          # If pytest tests are added later:
          # pytest


      # --------------------------------------------------------
      # 5. SONARQUBE SCAN
      # --------------------------------------------------------

      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v7

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        with:

          projectBaseDir: app


      # --------------------------------------------------------
      # 6. INSTALL TRIVY
      # --------------------------------------------------------

      - name: Install Trivy

        run: |

          sudo apt-get update

          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy


      # --------------------------------------------------------
      # 7. TRIVY FILESYSTEM SCAN
      # --------------------------------------------------------

      - name: Trivy Filesystem Scan

        run: |

          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .


  # ==========================================================
  # JOB 2: DOCKER BUILD AND ECR PUSH
  # ==========================================================

  build-and-push:

    name: Build Docker Image & Push to ECR

    runs-on: ubuntu-latest

    needs:

      - security-quality


    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT CODE
      # --------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # 2. CONFIGURE AWS CREDENTIALS
      # --------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}


      # --------------------------------------------------------
      # 3. LOGIN TO AMAZON ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # 4. SET IMAGE VARIABLES
      # --------------------------------------------------------

      - name: Set Image Variables

        run: |

          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "IMAGE_NAME=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" \
            >> $GITHUB_ENV


      # --------------------------------------------------------
      # 5. DISPLAY IMAGE INFORMATION
      # --------------------------------------------------------

      - name: Display Image Information

        run: |

          echo "======================================"

          echo "ECR Registry:"
          echo "$IMAGE_NAME"

          echo "Image Tag:"
          echo "$IMAGE_TAG"

          echo "Full Image:"
          echo "$IMAGE_NAME:$IMAGE_TAG"

          echo "======================================"


      # --------------------------------------------------------
      # 6. BUILD DOCKER IMAGE
      # --------------------------------------------------------

      - name: Build Docker Image

        working-directory: app

        run: |

          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .


      # --------------------------------------------------------
      # 7. INSTALL TRIVY
      # --------------------------------------------------------

      - name: Install Trivy

        run: |

          sudo apt-get update

          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy


      # --------------------------------------------------------
      # 8. TRIVY DOCKER IMAGE SCAN
      # --------------------------------------------------------

      - name: Trivy Docker Image Scan

        run: |

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $IMAGE_NAME:$IMAGE_TAG


      # --------------------------------------------------------
      # 9. PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Docker Image to ECR

        run: |

          docker push $IMAGE_NAME:$IMAGE_TAG


      # --------------------------------------------------------
      # 10. UPDATE KUBERNETES DEPLOYMENT
      # --------------------------------------------------------

      - name: Update Kubernetes Deployment Image

        run: |

          echo "Updating Kubernetes deployment..."

          sed -i \
            "s|image: IMAGE_PLACEHOLDER|image: $IMAGE_NAME:$IMAGE_TAG|g" \
            app/k8s/deployment.yaml


      # --------------------------------------------------------
      # 11. DISPLAY UPDATED IMAGE
      # --------------------------------------------------------

      - name: Verify Kubernetes Image

        run: |

          echo "======================================"

          echo "Updated Kubernetes Deployment:"

          grep "image:" app/k8s/deployment.yaml

          echo "======================================"


      # --------------------------------------------------------
      # 12. COMMIT UPDATED MANIFEST
      # --------------------------------------------------------

      - name: Commit Kubernetes Manifest

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add app/k8s/deployment.yaml


          git commit \
            -m "Update image to ${IMAGE_TAG} [skip ci]" \
            || echo "No changes to commit"


      # --------------------------------------------------------
      # 13. PUSH UPDATED MANIFEST TO GITHUB
      # --------------------------------------------------------

      - name: Push Kubernetes Manifest

        run: |

          git push


      # --------------------------------------------------------
      # 14. DISPLAY FINAL IMAGE
      # --------------------------------------------------------

      - name: Display Final Image

        run: |

          echo "======================================"

          echo "CI PIPELINE COMPLETED"

          echo "Docker Image Successfully Pushed"

          echo "$IMAGE_NAME:$IMAGE_TAG"

          echo "Kubernetes Manifest Updated"

          echo "GitOps Change Pushed to GitHub"

          echo "Argo CD will now synchronize the change"

          echo "======================================"

  # ==========================================================
  # JOB 3: OWASP ZAP DAST
  # ==========================================================

  dast-zap:

    name: OWASP ZAP DAST Scan

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    env:

      ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}

    steps:

      # --------------------------------------------------------
      # 1. DISPLAY TARGET
      # --------------------------------------------------------

      - name: Display ZAP Target

        run: |

          echo "======================================"

          echo "OWASP ZAP DAST Scan"

          echo "Target Application:"
          echo "$ZAP_TARGET_URL"

          echo "======================================"


      # --------------------------------------------------------
      # 2. RUN OWASP ZAP BASELINE SCAN
      # --------------------------------------------------------

      - name: OWASP ZAP Baseline Scan

        uses: zaproxy/action-baseline@v0.15.0

        with:

          target: ${{ secrets.ZAP_TARGET_URL }}

          cmd_options: "-a"

          allow_issue_writing: false


      # --------------------------------------------------------
      # 3. DAST COMPLETION
      # --------------------------------------------------------

      - name: DAST Scan Completed

        run: |

          echo "======================================"

          echo "OWASP ZAP DAST SCAN COMPLETED"

          echo "Target:"
          echo "$ZAP_TARGET_URL"

          echo "======================================"
