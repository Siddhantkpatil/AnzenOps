name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:

  # ==========================================================
  # JOB 1: CODE QUALITY AND SECURITY
  # ==========================================================

  security-quality:

    name: Code Quality & Security

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT CODE
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. SETUP PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # 4. RUN PYTHON TESTS
      # --------------------------------------------------------

      - name: Run Tests
        working-directory: app
        run: |
          python -m compileall .
          
          # If you have pytest tests later,
          # replace/add:
          # pytest

      # --------------------------------------------------------
      # 5. SONARQUBE SCAN
      # --------------------------------------------------------

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: app

      # --------------------------------------------------------
      # 6. INSTALL TRIVY
      # --------------------------------------------------------

      - name: Install Trivy
        run: |

          sudo apt-get update

          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy

      # --------------------------------------------------------
      # 7. TRIVY FILESYSTEM SCAN
      # --------------------------------------------------------

      - name: Trivy Filesystem Scan
        run: |

          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .

  # ==========================================================
  # JOB 2: DOCKER BUILD AND ECR PUSH
  # ==========================================================

  build-and-push:

    name: Build Docker Image & Push to ECR

    runs-on: ubuntu-latest

    needs:
      - security-quality

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT CODE
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. CONFIGURE AWS CREDENTIALS
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # 3. LOGIN TO AMAZON ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # 4. SET IMAGE TAG
      # --------------------------------------------------------

      - name: Set Image Tag
        id: image
        run: |

          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "IMAGE_NAME=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" \
            >> $GITHUB_ENV

      # --------------------------------------------------------
      # 5. BUILD DOCKER IMAGE
      # --------------------------------------------------------

      - name: Build Docker Image
        working-directory: app
        run: |

          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            .

      # --------------------------------------------------------
      # 6. INSTALL TRIVY
      # --------------------------------------------------------

      - name: Install Trivy
        run: |

          sudo apt-get update

          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy

      # --------------------------------------------------------
      # 7. TRIVY DOCKER IMAGE SCAN
      # --------------------------------------------------------

      - name: Trivy Docker Image Scan
        run: |

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $IMAGE_NAME:$IMAGE_TAG

      # --------------------------------------------------------
      # 8. PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Docker Image to ECR
        run: |

          docker push $IMAGE_NAME:$IMAGE_TAG

          docker push $IMAGE_NAME:latest

      # --------------------------------------------------------
      # 9. DISPLAY IMAGE
      # --------------------------------------------------------

      - name: Display Image
        run: |

          echo "Docker Image Successfully Pushed"

          echo "$IMAGE_NAME:$IMAGE_TAG"

          echo "$IMAGE_NAME:latest"
